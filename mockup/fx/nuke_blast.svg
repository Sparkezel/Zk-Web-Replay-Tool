    <path d="M120 160 C 114 186 107 200 96 212 C 114 219 142 219 160 212 C 149 200 142 186 136 160 Z" fill="__TINT__" opacity=".45"/>
    <path d="M66 108 C 96 120 160 120 190 108" fill="none" stroke="#000" stroke-width="3" opacity=".35"/>
