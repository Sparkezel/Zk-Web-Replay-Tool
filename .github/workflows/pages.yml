# Deploys the mockup viewer — index.html + replay.js + map.png + icons/ +
# battle.zkr (the pre-simulated artifact) — to GitHub Pages.
# Upload and deploy are separate jobs: deploy-pages looks the artifact up in
# the Actions Results service, which only indexes the artifact once the
# uploading job has fully completed (actions/deploy-pages#451).
name: Deploy viewer to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "mockup/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          # the viewer is self-contained: relative fetches of battle.zkr,
          # map.png and icons/ all resolve inside this directory
          path: mockup

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
